[project]
name = "florist"
version = "0.1.0"
description = "Florist grows ideas: inspiration feed, compost, greenhouse and an exploration loop that turns seeds into ready-to-run flower packs."
authors = [{ name = "Ivan Zhang", email = "ivanz@andrew.cmu.edu" }]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.7",
    "litellm>=1.50",
    "mcp>=1.2",
    "pypdf>=7.0.0",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
youtube = ["youtube-transcript-api>=0.6"]
vec = ["sqlite-vec>=0.1.6"]

[project.scripts]
florist = "florist.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
